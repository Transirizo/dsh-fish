# 宝塔（Nginx）反代 NapCat WebUI 的站点配置片段。
#
# ⚠️ NapCat WebUI 是 QQ 账号的控制台，公开暴露的风险远高于 DSH：
#    密码/令牌泄露 = 号可能被登走。更稳的做法是只用 Tailscale / SSH 隧道，
#    不要给它公网域名。下面只在“必须公网”时用。
#
# 用法：宝塔 → 网站 → napcat.example.com → 设置 → 配置文件，
# 放进 server { }，替换面板生成的 location / { ... }。
#
# 外层至少要有：TLS + 强密码（宝塔「访问限制」）+ IP 白名单（下面注释）。
# NapCat 自己的 WebUI token 仍然是第二层，别关。

# ---- 可选：IP 白名单（强烈建议；把 203.0.113.10 换成你自己的出口 IP） ----
# allow 203.0.113.10;
# deny all;

location / {
    proxy_pass http://127.0.0.1:16099;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # NapCat WebUI 用 WebSocket
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
