# 宝塔（Nginx）反代 DSH 的站点配置片段。
#
# 用法：宝塔 → 网站 → 你的域名 → 设置 → 配置文件，把下面内容放进 server { } 里，
# 替换掉面板生成的那段 location / { ... }（不要留两个 location /）。
#
# 关键点：
#   - proxy_set_header Host $host;  DSH 必须看到公网域名；缺这行会 403 或登录循环。
#   - /dsh-fish/ 和 /dsh-fish-v3/ 公网一律 404（桥只走 compose 内网 dsh:3080）。
#   - WebSocket/SSE 要 Upgrade + Connection + 关 buffering。
#
# 修改后：宝塔会做 nginx -t；通过再 reload。

# ---- 桥的入口不对外 ----
location ^~ /dsh-fish/ {
    return 404;
}
location ^~ /dsh-fish-v3/ {
    return 404;
}

# ---- DSH GUI ----
location / {
    proxy_pass http://127.0.0.1:13080;
    proxy_http_version 1.1;

    # 必须保留公网 Host；DSH 用 --trusted-host <域名> 接住它
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket / SSE
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
