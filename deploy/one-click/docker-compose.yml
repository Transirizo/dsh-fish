# 大肥鱼一键部署 —— 三个服务放同一个 docker 网络，靠容器名互访，不暴露公网。
# 运行前先跑 ./setup.sh <机器人QQ号>，它会生成密钥、写配置、装插件，再 docker compose up。
# 状态：首版，未在全新主机实测。QQ 扫码登录是交互步骤，脚本只负责起好容器打印入口。

services:
  dsh:
    image: runzhliu/deepseek-harness:0.2.2-rc.1-r1
    restart: unless-stopped
    environment:
      DSH_HOME: /home/node/.dsh
    volumes:
      - ./data/dsh:/home/node/.dsh            # profile + 凭据 + 运行数据
      - ./data/workspace:/workspace            # 整个工作区落盘（含 .dsh-fish）
      - ../../:/workspace/create/dsh-fish      # 项目代码，跟宿主机同一份
    ports:
      - "127.0.0.1:${DSH_PORT:-13080}:3080"      # 只绑回环；远程用 SSH 隧道，别暴露公网
    # --trusted-host dsh：桥若用容器名 dsh:3080 接上游 dsh-fish 的 /dsh-fish/*，
    # 这个 Host 必须写进信任栅栏，否则 403；走 127.0.0.1 访问则用不到。
    command: ["web", "--no-open", "--trusted-host", "dsh"]
    networks: [fishnet]

  napcat:
    image: mlikiowa/napcat-docker:latest
    restart: unless-stopped
    volumes:
      - ./data/napcat/config:/app/napcat/config # onebot11_<qq>.json（setup.sh 生成）
      - ./data/napcat/qq:/app/napcat/qq         # QQ 登录态，重启不丢
    ports:
      - "127.0.0.1:${NAPCAT_WEB_PORT:-16099}:6099"  # 只绑回环；扫码也走 SSH 隧道
    networks: [fishnet]

  bridge:
    image: runzhliu/deepseek-harness:0.2.2-rc.1-r1
    restart: unless-stopped
    entrypoint: ["node"]
    command: ["index.mjs"]
    working_dir: /app                          # 桥代码挂到 /app，工作目录必须对上
    env_file: ./data/bridge.env                # setup.sh 生成（含密钥）
    volumes:
      - ../../bridge/onebot:/app:ro            # 桥代码（只读）
      - ./data/bridge-state:/state             # 去重状态落盘（可写）
      - ./data/dsh:/dsh-home:ro                # 上游 dsh-fish：读签名密钥与 sessions/（v3 模式用不到）
    depends_on:
      - dsh
      - napcat
    networks: [fishnet]

networks:
  fishnet:
    driver: bridge
