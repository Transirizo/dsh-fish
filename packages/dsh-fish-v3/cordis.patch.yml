# dsh-fish-v3 —— bundle patch 层
# 只插一行插件；config 全部走 Config schema 的默认值，部署取值由用户在
# 自己 profile 的 cordis.patch.yml 里覆盖（会整体替换本行 config，属预期）。
- insert:
    - id: dsh-fish-v3
      name: dsh-fish-v3
    - id: preset-fish-chat
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: fish-chat
        name: 大肥鱼受限聊天
        description: 仅原生模型工具执行器；身份和会话记忆由可信入站setup安装，无工程工具。
        order: 40
        plugins:
          - id: native-tools
            name: '@deepseek-ai/dsh-tool-executor-native'
